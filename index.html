
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090611">
<title>YOR 2</title>

<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:24px;
display:grid;place-items:center;
background:radial-gradient(circle at top,#291044 0,#10091b 42%,#07060b 100%);
color:white;font-family:Arial,sans-serif
}
.card{
width:min(100%,420px);padding:28px 22px;
border:1px solid #7138a6;border-radius:24px;
background:#120d1def;box-shadow:0 0 30px #8b35d455
}
h1{text-align:center;font-size:36px;letter-spacing:5px;color:#c58cff;margin:0}
.sub{text-align:center;color:#c8b6d8;margin:8px 0 26px}
label{display:block;margin:14px 0 7px;color:#e7d8f5}
input{
width:100%;padding:14px;border-radius:12px;
border:1px solid #69418a;background:#090611;
color:white;font-size:16px;outline:none
}
input:focus{border-color:#b04cff}
button{
width:100%;margin-top:14px;padding:14px;border:0;
border-radius:12px;background:linear-gradient(90deg,#7b2bd1,#b04cff);
color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
#status,#searchStatus{
min-height:30px;margin-top:16px;color:#d9c5ed;
line-height:1.4;font-size:14px
}
.hint{font-size:12px;color:#9e8cac;line-height:1.4;margin-top:12px}
#searchSection{display:none;margin-top:24px}
.user-result{
padding:14px;margin-top:10px;border:1px solid #69418a;
border-radius:12px;background:#090611;cursor:pointer
}
.user-result:active{border-color:#b04cff}
.user-name{font-weight:bold;color:#d9aaff;font-size:17px}
.user-caption{font-size:12px;color:#9e8cac;margin-top:5px}
</style>
</head>

<body>
<main class="card">

<h1>YOR 2</h1>
<div class="sub">Твой мессенджер</div>

<section id="authSection">
<label for="name">Имя</label>
<input id="name" type="text" placeholder="Как вас зовут">

<label for="email">Email</label>
<input id="email" type="email" placeholder="name@example.com">

<label for="password">Пароль</label>
<input id="password" type="password" placeholder="Не менее 6 символов">

<button id="register" type="button">Создать аккаунт</button>
<button id="login" type="button">Войти</button>

<div id="status">Введите имя, email и пароль.</div>
</section>

<section id="searchSection">
<h2 style="color:#c58cff">Поиск пользователей</h2>
<button id="logoutButton" type="button">Выйти из аккаунта</button>

<label for="searchInput">Имя пользователя</label>
<input id="searchInput" type="text" placeholder="Введите имя для поиска">

<button id="searchButton" type="button">Найти пользователя</button>

<div id="searchStatus">Ищи пользователей YOR 2 по имени.</div>
<div id="results"></div>

<div id="chatSection" style="display:none;margin-top:24px">
<h2 id="chatTitle" style="color:#c58cff">Личный чат</h2>

<div id="chatMessages" style="height:300px;overflow-y:auto;border:1px solid #69418a;border-radius:12px;padding:12px;background:#090611">
<div style="color:#9e8cac">История сообщений будет здесь.</div>
</div>

<input id="messageInput" type="text" placeholder="Напиши сообщение...">

<button id="sendMessageButton" type="button">Отправить</button>
<button id="backToSearchButton" type="button">Назад к поиску</button>
</div>
</section>

<div class="hint">YOR 2 — общение без границ.</div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDhLGxXGFMGlqtPLRYnXn9M2zE2ODYd5rk",
authDomain: "yor-2-96bbd.firebaseapp.com",
projectId: "yor-2-96bbd",
storageBucket: "yor-2-96bbd.firebasestorage.app",
messagingSenderId: "841690613594",
appId: "1:841690613594:web:a69ef7b7de2ece7dde5563",
measurementId: "G-6C39MKH921"
};

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const registerButton = document.getElementById("register");
const loginButton = document.getElementById("login");
const statusBox = document.getElementById("status");
const authSection = document.getElementById("authSection");
const searchSection = document.getElementById("searchSection");
const searchInput = document.getElementById("searchInput");
const searchButton = document.getElementById("searchButton");
const logoutButton = document.getElementById("logoutButton");
const searchStatus = document.getElementById("searchStatus");
const results = document.getElementById("results");

const chatSection = document.getElementById("chatSection");
const chatTitle = document.getElementById("chatTitle");
const chatMessages = document.getElementById("chatMessages");
const messageInput = document.getElementById("messageInput");
const sendMessageButton = document.getElementById("sendMessageButton");
const backToSearchButton = document.getElementById("backToSearchButton");

let currentChatId = null;
let currentChatUser = null;

function setStatus(message){
statusBox.textContent = message;
}

function setBusy(busy){
registerButton.disabled = busy;
loginButton.disabled = busy;
}

if(!window.firebase){
setStatus("Firebase не загрузился. Проверь интернет.");
throw new Error("Firebase не загрузился");
}

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();
auth.languageCode = "ru";

let currentUser = null;

// Сохранение личного и публичного профиля
async function saveUserProfile(user,name){
const userName = name || user.displayName || "Пользователь";

try{
await db.collection("users").doc(user.uid).set({
uid:user.uid,
name:userName,
email:user.email,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});
}catch(error){
console.error("Ошибка users:",error);
throw new Error("Ошибка личного профиля: "+error.message);
}

try{
await db.collection("publicProfiles").doc(user.uid).set({
uid:user.uid,
name:userName,
nameLower:userName.toLowerCase(),
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});
}catch(error){
console.error("Ошибка publicProfiles:",error);
throw new Error("Ошибка публичного профиля: "+error.message);
}
}

// Показ главного экрана
function showSearchApp(user){
currentUser = user;
authSection.style.display = "none";
searchSection.style.display = "block";
}

// Выход из аккаунта
logoutButton.addEventListener("click",async function(){
try{
await auth.signOut();
currentUser = null;
currentChatId = null;
currentChatUser = null;
chatSection.style.display = "none";
searchSection.style.display = "none";
authSection.style.display = "block";
setStatus("Вы вышли из аккаунта.");
}catch(error){
setStatus("Ошибка выхода: "+error.message);
}
});

// Регистрация
registerButton.addEventListener("click",async function(){
const name = nameInput.value.trim();
const email = emailInput.value.trim();
const password = passwordInput.value;

if(!name || !email || !password){
setStatus("Заполните все поля.");
return;
}

if(password.length < 6){
setStatus("Пароль должен содержать минимум 6 символов.");
return;
}

setBusy(true);
setStatus("Создаём аккаунт...");

try{
const result = await auth.createUserWithEmailAndPassword(email,password);
await result.user.updateProfile({displayName:name});
await saveUserProfile(result.user,name);

setStatus("Аккаунт создан!");
showSearchApp(result.user);
}catch(error){
console.error(error);
setStatus("Ошибка: "+error.message);
}finally{
setBusy(false);
}
});

// Вход
loginButton.addEventListener("click",async function(){
const email = emailInput.value.trim();
const password = passwordInput.value;

if(!email || !password){
setStatus("Введите email и пароль.");
return;
}

setBusy(true);
setStatus("Выполняем вход...");

try{
const result = await auth.signInWithEmailAndPassword(email,password);
await saveUserProfile(result.user,result.user.displayName);

setStatus("Вход выполнен!");
showSearchApp(result.user);
}catch(error){
console.error(error);
setStatus("Ошибка: "+error.message);
}finally{
setBusy(false);
}
});

// Открытие личного чата
async function openChat(userId,userName){
if(!currentUser || userId === currentUser.uid) return;

try{
searchStatus.textContent = "Открываем чат...";

const snapshot = await db.collection("chats")
.where("members","array-contains",currentUser.uid)
.get();

let chatDoc = null;

snapshot.forEach(function(doc){
const members = doc.data().members || [];

if(members.length === 2 && members.includes(userId)){
chatDoc = doc;
}
});

if(!chatDoc){
chatDoc = db.collection("chats").doc();

await chatDoc.set({
members:[currentUser.uid,userId],
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}

currentChatId = chatDoc.id;
currentChatUser = userId;

chatTitle.textContent = "Чат с " + userName;
chatMessages.textContent = "Чат открыт. История сообщений появится после подключения сообщений.";
chatSection.style.display = "block";

searchInput.style.display = "none";
searchButton.style.display = "none";
searchStatus.style.display = "none";
results.style.display = "none";

}catch(error){
console.error(error);
searchStatus.textContent = "Ошибка открытия чата: " + error.message;
}
}

// Возврат к поиску
backToSearchButton.addEventListener("click",function(){
chatSection.style.display = "none";
searchInput.style.display = "block";
searchButton.style.display = "block";
searchStatus.style.display = "block";
results.style.display = "block";

currentChatId = null;
currentChatUser = null;
});

// Поиск пользователей
searchButton.addEventListener("click",async function(){

if(!currentUser){
searchStatus.textContent = "Сначала войдите в аккаунт.";
return;
}

const searchTerm = searchInput.value.trim().toLowerCase();

if(searchTerm.length < 2){
searchStatus.textContent = "Введите минимум 2 буквы.";
results.replaceChildren();
return;
}

searchButton.disabled = true;
searchStatus.textContent = "Ищем пользователей...";
results.replaceChildren();

try{
const snapshot = await db.collection("publicProfiles")
.orderBy("nameLower")
.startAt(searchTerm)
.endAt(searchTerm+"\uf8ff")
.limit(20)
.get();

let found = 0;

snapshot.forEach(function(doc){
if(doc.id === currentUser.uid) return;

const profile = doc.data();

const item = document.createElement("div");
item.className = "user-result";

const userName = document.createElement("div");
userName.className = "user-name";
userName.textContent = profile.name || "Пользователь";

const caption = document.createElement("div");
caption.className = "user-caption";
caption.textContent = "Пользователь YOR 2";

// Нажатие на пользователя открывает чат
item.addEventListener("click",function(){
openChat(profile.uid,profile.name || "Пользователь");
});

item.appendChild(userName);
item.appendChild(caption);
results.appendChild(item);

found++;
});

if(found === 0){
searchStatus.textContent = "Пользователи не найдены.";
}else{
searchStatus.textContent = "Найдено пользователей: "+found;
}

}catch(error){
console.error("Ошибка поиска:",error);
searchStatus.textContent = "Ошибка поиска: "+error.message;
}finally{
searchButton.disabled = false;
}
});

// Восстановление экрана после обновления страницы
auth.onAuthStateChanged(async function(user){
if(user){
try{
await saveUserProfile(user,user.displayName);
showSearchApp(user);
}catch(error){
console.error(error);
setStatus("Ошибка обновления профиля: "+error.message);
}
}
});
</script>
</body>
</html>
