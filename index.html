
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090611">
<title>YOR 2 — Регистрация и вход</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:grid;place-items:center;
padding:24px;background:radial-gradient(circle at top,#291044 0,#10091b 42%,#07060b 100%);
color:#fff;font-family:Arial,sans-serif
}
.card{
width:min(100%,390px);padding:28px 22px;
border:1px solid #7138a6;border-radius:24px;
background:#120d1def;box-shadow:0 0 30px #8b35d455
}
h1{text-align:center;font-size:36px;letter-spacing:5px;color:#c58cff;margin:0}
.sub{text-align:center;color:#c8b6d8;margin:8px 0 26px}
label{display:block;margin:14px 0 7px;color:#e7d8f5}
input{
width:100%;padding:14px;border-radius:12px;
border:1px solid #69418a;background:#090611;
color:white;font-size:16px;outline:none
}
input:focus{border-color:#b04cff}
button{
width:100%;margin-top:14px;padding:14px;border:0;
border-radius:12px;background:linear-gradient(90deg,#7b2bd1,#b04cff);
color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
#status{min-height:44px;margin-top:16px;color:#d9c5ed;line-height:1.4;font-size:14px}
.hint{font-size:12px;color:#9e8cac;line-height:1.4;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<h1>YOR 2</h1>
<div class="sub">Регистрация и вход по email</div>

<label for="name">Имя</label>
<input id="name" type="text" placeholder="Как вас зовут" autocomplete="name">

<label for="email">Email</label>
<input id="email" type="email" placeholder="name@example.com" autocomplete="email">

<label for="password">Пароль</label>
<input id="password" type="password" placeholder="Не менее 6 символов" autocomplete="new-password">

<button id="register" type="button">Создать аккаунт</button>
<button id="login" type="button">Войти</button>

<div id="status" role="status" aria-live="polite">Введите имя, email и пароль.</div>
<div class="hint">
Для регистрации укажите имя, действующий email и пароль не менее 6 символов.
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDhLGxXGFMGlqtPLRYnXn9M2zE2ODYd5rk",
authDomain: "yor-2-96bbd.firebaseapp.com",
projectId: "yor-2-96bbd",
storageBucket: "yor-2-96bbd.firebasestorage.app",
messagingSenderId: "841690613594",
appId: "1:841690613594:web:a69ef7b7de2ece7dde5563",
measurementId: "G-6C39MKH921"
};

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const registerButton = document.getElementById("register");
const loginButton = document.getElementById("login");
const statusBox = document.getElementById("status");

function setStatus(message) {
statusBox.textContent = message;
}

function setBusy(busy) {
registerButton.disabled = busy;
loginButton.disabled = busy;
}

if (!window.firebase) {
setStatus("Firebase не загрузился. Проверьте интернет.");
throw new Error("Firebase не загрузился");
}

if (!firebase.apps.length) {
firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();
auth.languageCode = "ru";

// Сохранение профиля пользователя в коллекцию users
async function saveUserProfile(user, name) {
await db.collection("users").doc(user.uid).set({
uid: user.uid,
name: name || user.displayName || "Пользователь",
email: user.email,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
}, {merge: true});
}

// Регистрация
registerButton.addEventListener("click", async function() {
const name = nameInput.value.trim();
const email = emailInput.value.trim();
const password = passwordInput.value;

if (!name || !email || !password) {
setStatus("Заполните имя, email и пароль.");
return;
}

if (password.length < 6) {
setStatus("Пароль должен содержать минимум 6 символов.");
return;
}

setBusy(true);
setStatus("Создаём аккаунт...");

try {
const result = await auth.createUserWithEmailAndPassword(email, password);
await result.user.updateProfile({displayName: name});

setStatus("Аккаунт создан. Сохраняем профиль...");

await saveUserProfile(result.user, name);

setStatus("Ура! Аккаунт создан и профиль сохранён в YOR 2!");
} catch (error) {
console.error(error);

const messages = {
"auth/email-already-in-use": "Этот email уже зарегистрирован. Нажмите Войти.",
"auth/invalid-email": "Проверьте правильность email.",
"auth/weak-password": "Пароль слишком простой.",
"auth/operation-not-allowed": "В Firebase не включён Email/Password.",
"permission-denied": "Нет доступа к базе. Нужно настроить Rules в Firestore."
};

setStatus(messages[error.code] || ("Ошибка: " + error.message));
} finally {
setBusy(false);
}
});

// Вход
loginButton.addEventListener("click", async function() {
const email = emailInput.value.trim();
const password = passwordInput.value;

if (!email || !password) {
setStatus("Введите email и пароль.");
return;
}

setBusy(true);
setStatus("Выполняем вход...");

try {
const result = await auth.signInWithEmailAndPassword(email, password);

await saveUserProfile(result.user, result.user.displayName);

setStatus("Вы успешно вошли в YOR 2!");
} catch (error) {
console.error(error);

const messages = {
"auth/invalid-email": "Проверьте правильность email.",
"auth/user-not-found": "Аккаунт не найден. Сначала зарегистрируйтесь.",
"auth/wrong-password": "Неверный пароль.",
"auth/invalid-credential": "Неверный email или пароль.",
"auth/operation-not-allowed": "В Firebase не включён Email/Password.",
"permission-denied": "Нет доступа к базе. Нужно настроить Rules в Firestore."
};

setStatus(messages[error.code] || ("Ошибка: " + error.message));
} finally {
setBusy(false);
}
});

auth.onAuthStateChanged(function(user) {
if (user) {
setStatus("Вы вошли в YOR 2 как " + (user.displayName || user.email));
}
});
</script>
</body>
</html>
